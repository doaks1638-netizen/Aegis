[project]
name = "aegis"
version = "0.1.0"
description = "Protect heavy backend APIs (LLMs, ML models, scraping) from traffic spikes with 2 stage rate limiting and Redis queuing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fakeredis>=2.37.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
    "uvloop>=0.22.1",
]
