services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  aegis:
    build:
      context: .
      dockerfile: ./aegis/Dockerfile
    container_name: aegis
    restart: unless-stopped
    command: uv run uvicorn src.api.router:app --host 0.0.0.0 --port 6378 --loop uvloop
    ports:
      - "6378:6378"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MQ_USER=${MQ_USER}
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - external
      - internal

  push_service:
    build:
      context: .
      dockerfile: ./push_service/Dockerfile
    container_name: push_service
    restart: unless-stopped
    command: uv run main.py
    environment:
      - TG_TOKEN=${TG_TOKEN}
      - TG_CHAT_ID=${TG_CHAT_ID}
      - MQ_USER=${MQ_USER}
      - MQ_PASSWORD=${MQ_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  #nginx:
  #  build:
  #    context: .
  #    dockerfile: ./nginx/Dockerfile
  #  restart: always
  #  ports:
  #    - "80:80"
  #  depends_on:
  #    - aegis
  #  networks:
  #    - external

volumes:
  redis-data:
    driver: local

networks:
  external:
  internal:
